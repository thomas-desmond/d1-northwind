main = "index.ts"
name = "northwind-api"
compatibility_flags = ["nodejs_compat"]
compatibility_date = "2024-09-23"
account_id = "d6850012d250c1600028b55d1d879b16"
# logpush = true

[[routes]]
pattern = "api.cf-northwind.com"
custom_domain = true

[observability]
enabled = true

[observability.traces]
enabled = true

[dev]
port = 8789

[placement]
mode = "smart"

[[d1_databases]]
binding = "DB"
database_name = "northwind"
database_id = "d2757109-c1bf-4a66-b325-4d9c09b3e3a7"

[[kv_namespaces]]
binding = "PRODUCT_SEARCH_CACHE"
id = "fb5a73689cfa48f7a901706440c193af"

[[vectorize]]
binding = "VECTORIZE"
index_name = "northwind-vector-db"
